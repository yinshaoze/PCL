
name: Build

on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
        describe=`git describe --tags --always`
        echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Update Help
      run: |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}

    - name: Replace Secrets and Commit Hash
      shell: pwsh
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        COMMIT_HASH: ${{ github.sha }}
      run: |
        $secretFile = "Plain Craft Launcher 2\Modules\ModSecret.vb"
        $baseFile = "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

        $content = [System.IO.File]::ReadAllText($secretFile)

        # Replace OAuth Client ID if the repository secret is available.
        $oldClient = 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")'

        if (-not [string]::IsNullOrWhiteSpace($env:CLIENT_ID)) {
          $escapedClient = $env:CLIENT_ID.Replace('"', '""')
          $newClient = 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "' + $escapedClient + '")'

          if ($content.Contains($oldClient)) {
            $content = $content.Replace($oldClient, $newClient)
            Write-Host "OAuth Client ID replacement succeeded."
          }
          elseif (-not $content.Contains($newClient)) {
            throw "OAuthClientId definition did not match the expected source."
          }
        }
        else {
          Write-Host "CLIENT_ID is unavailable; using the source default."
        }

        # Replace CurseForge API key if the repository secret is available.
        $oldKey = 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")'

        if (-not [string]::IsNullOrWhiteSpace($env:CURSEFORGE_API_KEY)) {
          $escapedKey = $env:CURSEFORGE_API_KEY.Replace('"', '""')
          $newKey = 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "' + $escapedKey + '")'

          if ($content.Contains($oldKey)) {
            $content = $content.Replace($oldKey, $newKey)
            Write-Host "CurseForge API key replacement succeeded."
          }
          elseif (-not $content.Contains($newKey)) {
            throw "CurseForgeAPIKey definition did not match the expected source."
          }
        }
        else {
          Write-Host "CURSEFORGE_API_KEY is unavailable; using the source default."
        }

        [System.IO.File]::WriteAllText(
          $secretFile,
          $content,
          $utf8NoBom
        )

        # Replace commit hash.
        $baseContent = [System.IO.File]::ReadAllText($baseFile)
        $oldHash = 'Public Const CommitHash As String = ""'
        $newHash = 'Public Const CommitHash As String = "' + $env:COMMIT_HASH + '"'

        if ($baseContent.Contains($oldHash)) {
          $baseContent = $baseContent.Replace($oldHash, $newHash)
        }
        elseif (-not $baseContent.Contains($newHash)) {
          throw "CommitHash definition did not match the expected source."
        }

        [System.IO.File]::WriteAllText(
          $baseFile,
          $baseContent,
          $utf8NoBom
        )

        Write-Host "Source updates completed."

    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\\${{ matrix.configuration }}\Plain Craft Launcher 2.exe
